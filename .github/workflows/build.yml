name: Build MaliBridge
run-name: ${{ github.actor }} is building MaliBridge

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    build:
        name: Build ${{ matrix.target }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: linux-x86-64
                      cmake-flags: >-
                          -DCMAKE_SYSTEM_NAME=Linux
                          -DCMAKE_BUILD_TYPE=Release
                          -DBUILD_VARIANT=linux-x86-64

                    - target: linux-aarch64
                      cmake-flags: >-
                          -DCMAKE_SYSTEM_NAME=Linux
                          -DCMAKE_BUILD_TYPE=Release
                          -DCMAKE_SYSTEM_PROCESSOR=aarch64
                          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
                          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
                          -DBUILD_VARIANT=linux-aarch64

                    - target: android-arm64
                      cmake-flags: >-
                          -DCMAKE_SYSTEM_NAME=Android
                          -DANDROID_PLATFORM=26
                          -DANDROID_ABI=arm64-v8a
                          -DANDROID_TOOLCHAIN=clang
                          -DANDROID_STL=c++_static
                          -DCMAKE_BUILD_TYPE=Release
                          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
                          -DBUILD_VARIANT=android-arm64

        steps:
            - name: Install System Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    openjdk-17-jre-headless \
                    glslang-tools \
                    glslc \
                    xxd \
                    libvulkan-dev \
                    glibc-source

            - name: Checkout source code
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Install AArch64 Cross Compiler
              if: matrix.target == 'linux-aarch64'
              run: |
                  sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

            - name: Configure CMake
              run: |
                  cmake -B build ${{ matrix.cmake-flags }} -DCMAKE_INSTALL_PREFIX=out-${{ matrix.target }}/usr/local

            - name: Build MaliBridge
              run: |
                  cmake --build build --config Release
                  cmake --install build
                  tree out-${{ matrix.target }}

            - name: Upload MaliBridge
              uses: actions/upload-artifact@v6
              with:
                  name: MaliBridge-${{ matrix.target }}
                  path: |
                      out-${{ matrix.target }}

name: Test MaliBridge
run-name: ${{ github.actor }} is testing MaliBridge

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    test:
        name: Test ${{ matrix.target }}
        runs-on: ubuntu-latest

        env:
            # Use lvp
            VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
            VKB_HOST_ICD: /usr/share/vulkan/icd.d/lvp_icd.json

        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: linux-x86-64
                      cmake-flags: >-
                          -DCMAKE_SYSTEM_NAME=Linux
                          -DCMAKE_BUILD_TYPE=Release
                          -DBUILD_VARIANT=linux-x86-64

        steps:
            - name: Install System Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    glslang-tools \
                    glslc \
                    xxd \
                    libvulkan-dev \
                    mesa-vulkan-drivers \
                    python3

            - name: Checkout source code
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Configure CMake
              run: |
                  cmake -B build ${{ matrix.cmake-flags }}

            - name: Build MaliBridge
              run: cmake --build build --config Release

            - name: The Cached Server Hook List
              run: host/hook_list_test.sh

            - name: Build the Host Programs
              if: matrix.target == 'linux-x86-64'
              run: make -C host

            - name: Quick Checks
              if: matrix.target == 'linux-x86-64'
              run: host/quick_check.sh
